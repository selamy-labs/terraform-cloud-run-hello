name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/137181243924/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: forge-infra@patrick-agents-prod.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - run: terraform fmt -check
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - run: terraform apply -auto-approve tfplan
      - run: curl --fail --retry 10 --retry-delay 3 "$(terraform output -raw url)"
